enemy_color: "red"
# enemy_color: "blue"
rotation_angle: 0

#####-----神经网络参数-----#####
yolo_name: yolov5
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: true
roi:
  x: 460
  y: 200
  width: 600
  height: 600
use_roi: false
threshold: 100

yaw_offset: 2 # degree -2.5
pitch_offset: 6.5 # degree 2

camera_name: "hikrobot"
exposure_ms: 2.5
gain: 16.9
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.1343px
camera_matrix: [1809.234195387095, 0, 704.31187942650604, 0, 1813.0102441212994, 551.84741058200325, 0, 0, 1]
distort_coeffs: [-0.077198727509676837, 0.15037874517911318, 0.0015735581437855061, 0.001040223876430159, 0]

# 相机同理想情况的偏角: yaw0.45 pitch-3.00 roll0.09 degree
# 标定板到世界坐标系原点的水平距离: 1.13 m
# 标定板同竖直摆放时的偏角: yaw-113.55 pitch13.12 roll0.32 degree
R_camera2gimbal: [-0.0080131954294522384, -0.052394960826908567, 0.9985942903797097, -0.99996668029748925, 0.001975655200289353, -0.0079205480459238874, -0.0015578811981739912, -0.99862448641442592, -0.052409046353621917]
t_camera2gimbal: [0.041545038711890976, 0.002043263447746746, 0.092648548907388106]

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"
# Task2 starting configuration; calibration/offsets are inherited examples, not measured here.
command_timeout_ms: 100
task2:
  armor_num: 4
  initial_radius: 0.2
  radius_variance: 0.01
  radius_diff_variance: 0.01
  height_diff_variance: 0.01
  acceleration_variance: 0.5
  angular_acceleration_variance: 4.0
  z_acceleration_variance: 0.1
  max_nis: 18.5
  max_prediction_dt: 2.0
  confirm_frames: 3
  association_distance: 0.6
  association_angle: 60.0
  max_observation_facing: 80.0
  lost_time: 0.3
  min_updates: 20
  warmup_time: 0.5
  max_omega_variance: 0.25
  min_spin_speed: 2.0
  max_spin_speed: 12.0
  fire_delay: 0.03
  max_frame_age: 0.3
  # image receive delay minus pose receive delay; signed, requires measurement.
  camera_to_pose_offset_ms: 0.0
  pose_timeout_ms: 20
  feedback_timeout: 0.1
  max_reprojection_error_px: 5.0
  pitch_limit: 20.0
  max_facing_angle: 60.0
  fire_facing_angle: 35.0
  yaw_tolerance: 0.8
  pitch_tolerance: 0.8
  min_bullet_speed: 14.0
  max_bullet_speed: 35.0
  follow_without_ballistics: true
  # Process-wide request cap, NOT an automatic low/medium round counter.
  shot_limit: 0
